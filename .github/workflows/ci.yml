name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same ref so a force-push doesn't queue.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Build
        env:
          TURSO_DATABASE_URL: "libsql://ci-placeholder.turso.io"
          TURSO_AUTH_TOKEN: "ci-placeholder-token"
          DATABASE_URL: "file:/tmp/recall-ci.db"
          DIRECT_DATABASE_URL: "file:/tmp/recall-ci.db"
          SESSION_SECRET: "ci-placeholder-secret-32-chars-minimum-ok"
          GITHUB_CLIENT_ID: "ci-placeholder-client-id"
          GITHUB_CLIENT_SECRET: "ci-placeholder-client-secret"
          NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
          NEXT_PUBLIC_SITE_NAME: "Recall"
          REALTIME_PORT: "3003"
        run: bun run build
